<article class="am-card h-100 d-flex flex-column">
  <a class="am-img" [routerLink]="['/catalogo', vehiculo().id]" [attr.aria-label]="'Ver ' + vehiculo().nombre" tabindex="-1">
    @if (vehiculo().imagenes[0]; as foto) {
      <img [src]="foto" [alt]="vehiculo().nombre" loading="lazy" (error)="$any($event.target).style.display = 'none'" />
    }
  </a>

  <div class="p-3 d-flex flex-column flex-grow-1">
    <h3 class="titulo">{{ vehiculo().nombre }}</h3>
    <p class="am-price mb-3">{{ vehiculo().precio | cop }}</p>

    @if (accion() === 'comprar') {
      <a class="btn btn-navy mt-auto" routerLink="/contacto" [queryParams]="{ vehiculo: vehiculo().id }">
        Comprar
      </a>
    } @else {
      <a class="btn btn-navy mt-auto" [routerLink]="['/catalogo', vehiculo().id]">Ver más</a>
    }
  </div>
</article>
